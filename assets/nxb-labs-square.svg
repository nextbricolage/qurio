<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="nxb labs">
  <defs>
    <linearGradient id="nxbGradSq" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D2B64"/>
      <stop offset="1" stop-color="#5B4B8A"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded-square + isometric cube, centered in the upper area -->
  <g transform="translate(136,56) scale(0.46875)">
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#nxbGradSq)"/>
    <!-- Top face -->
    <path d="M256 112 382 185 256 258 130 185Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Left face -->
    <path d="M130 185 256 258 256 400 130 327Z" fill="#FFFFFF" fill-opacity="0.55"/>
    <!-- Right face -->
    <path d="M382 185 256 258 256 400 382 327Z" fill="#FFFFFF" fill-opacity="0.75"/>
    <!-- Accent edge highlight -->
    <path d="M256 258 256 400" stroke="#1D2B64" stroke-opacity="0.25" stroke-width="4"/>
  </g>

  <!-- Wordmark: "nxb labs" centered below the mark -->
  <text x="256" y="400" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif"
        font-size="72" letter-spacing="-1">
    <tspan font-weight="700" fill="#172B4D">nxb</tspan><tspan font-weight="400" fill="#5E6C84" letter-spacing="1" dx="18">labs</tspan>
  </text>

  <!-- Tagline -->
  <text x="256" y="440" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DejaVu Sans', Arial, sans-serif"
        font-size="18" font-weight="500" fill="#8993A4" letter-spacing="4">ATLASSIAN FORGE APPS</text>
</svg>
